name: Build Android APK

# Máy này không cài được Android SDK (dl.google.com bị chặn), nên APK được đóng
# gói ở đây — runner của GitHub có sẵn SDK. Cùng cách làm với bản Windows.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Kiểm kiểu và luật gộp dữ liệu chạy trước, khỏi tốn 10 phút build một bản
      # đã hỏng sẵn từ trong mã nguồn.
      - run: npm run typecheck
      - run: npm run test:sync

      # Khoá ký cố định để SHA-1 không đổi giữa các lần build — client OAuth
      # Android của Google khoá theo vân tay này. Chưa cấu hình secret thì bước
      # này bỏ qua và APK ký bằng khoá gỡ lỗi, vẫn cài được.
      - name: Lấy khoá ký
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/denken.keystore

      - name: Đóng gói APK
        run: npm run android:apk
        env:
          DENKEN_KEYSTORE: ${{ env.HAS_KEYSTORE == 'true' && 'android/denken.keystore' || '' }}
          DENKEN_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DENKEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DENKEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Xoá khoá ký khỏi máy chạy
        if: always()
        run: rm -f android/denken.keystore

      - name: Đặt tên file theo phiên bản
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/Denken-3-shuu-$VERSION.apk"

      # APK chỉ 6 MB nên vẫn giữ cho từng commit — cài thử trên máy là việc làm
      # hằng ngày. Nhưng cắt hạn xuống 5 ngày, và luồng "Dọn kho bản build" chạy
      # ngay sau đây sẽ xoá các bản cũ, chỉ giữ bản mới nhất.
      - uses: actions/upload-artifact@v4
        with:
          name: Denken-3-shuu-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 5

      # Chưa có khoá ký cố định thì phải nói thẳng ra ngay tại trang build, chứ
      # không để người tải về tự vấp. Xem docs/KHOA-KY-ANDROID.md.
      - name: Nhắc về khoá ký
        if: env.HAS_KEYSTORE != 'true'
        run: |
          {
            echo "## ⚠️ APK này KHÔNG cập nhật đè lên bản cũ được"
            echo
            echo "Repo chưa cấu hình khoá ký cố định, nên mỗi lần build máy chạy"
            echo "lại tự sinh một khoá gỡ lỗi mới. Android coi hai bản ký bằng hai"
            echo "khoá khác nhau là hai app khác nhau và **từ chối cập nhật đè**."
            echo
            echo "Hậu quả: mỗi lần vá phải gỡ app rồi cài lại — mà gỡ app là"
            echo "**xoá sạch dữ liệu học** trong máy."
            echo
            echo "Cách sửa một lần cho xong: \`npm run android:khoa-ky\`,"
            echo "rồi làm theo \`docs/KHOA-KY-ANDROID.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Đẩy tag v* thì đính APK vào bản phát hành, cạnh file .exe của Windows.
      - name: Đính vào bản phát hành
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
