name: Build Android APK

# Máy này không cài được Android SDK (dl.google.com bị chặn), nên APK được đóng
# gói ở đây — runner của GitHub có sẵn SDK. Cùng cách làm với bản Windows.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Kiểm kiểu và luật gộp dữ liệu chạy trước, khỏi tốn 10 phút build một bản
      # đã hỏng sẵn từ trong mã nguồn.
      - run: npm run typecheck
      - run: npm run test:sync

      # Khoá ký cố định để SHA-1 không đổi giữa các lần build — client OAuth
      # Android của Google khoá theo vân tay này. Chưa cấu hình secret thì bước
      # này bỏ qua và APK ký bằng khoá gỡ lỗi, vẫn cài được.
      - name: Lấy khoá ký
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/denken.keystore

      - name: Đóng gói APK
        run: npm run android:apk
        env:
          DENKEN_KEYSTORE: ${{ env.HAS_KEYSTORE == 'true' && 'android/denken.keystore' || '' }}
          DENKEN_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DENKEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DENKEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Xoá khoá ký khỏi máy chạy
        if: always()
        run: rm -f android/denken.keystore

      - name: Đặt tên file theo phiên bản
        id: ten
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/Denken-3-shuu-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # APK chỉ 6 MB nên vẫn giữ cho từng commit — cài thử trên máy là việc làm
      # hằng ngày. Nhưng cắt hạn xuống 5 ngày, và luồng "Dọn kho bản build" chạy
      # ngay sau đây sẽ xoá các bản cũ, chỉ giữ bản mới nhất.
      #
      # `continue-on-error` cố ý: kho đầy là chuyện của cái kho, không phải lỗi
      # của mã nguồn. Trước đây hết chỗ là bước này đỏ, kéo cả luồng đỏ theo, và
      # nhìn vào chỉ thấy "build hỏng" — trong khi APK đã đóng gói xong xuôi rồi.
      # Tệ hơn nữa: bước đính vào Releases nằm SAU đây nên cũng không chạy, mất
      # nốt đường lấy file duy nhất còn lại. Kho GitHub tính lại dung lượng mỗi
      # 6–12 tiếng, nên xoá xong vẫn còn kẹt một lúc; đừng để cái đó chặn build.
      - id: tai_len
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Denken-3-shuu-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 5

      - name: Báo khi kho đầy
        if: steps.tai_len.outcome == 'failure'
        run: |
          {
            echo "## 📦 APK đóng gói xong nhưng chưa tải lên được"
            echo
            echo "Kho bản build của tài khoản đã đầy. Bản thân APK **không sao** —"
            echo "mã nguồn build sạch, chỉ là không có chỗ để cất file."
            echo
            echo "Hai đường lấy file:"
            echo "- Chạy luồng **Dọn kho bản build** rồi bấm Re-run. Lưu ý GitHub"
            echo "  tính lại dung lượng mỗi 6–12 tiếng, xoá xong vẫn phải chờ."
            echo "- Hoặc đẩy một tag \`v*\` — APK sẽ vào Releases, kho riêng,"
            echo "  không đụng tới hạn mức này. Đây là đường chắc ăn."
          } >> "$GITHUB_STEP_SUMMARY"

      # Chưa có khoá ký cố định thì phải nói thẳng ra ngay tại trang build, chứ
      # không để người tải về tự vấp. Xem docs/KHOA-KY-ANDROID.md.
      - name: Nhắc về khoá ký
        if: env.HAS_KEYSTORE != 'true'
        run: |
          {
            echo "## ⚠️ APK này KHÔNG cập nhật đè lên bản cũ được"
            echo
            echo "Repo chưa cấu hình khoá ký cố định, nên mỗi lần build máy chạy"
            echo "lại tự sinh một khoá gỡ lỗi mới. Android coi hai bản ký bằng hai"
            echo "khoá khác nhau là hai app khác nhau và **từ chối cập nhật đè**."
            echo
            echo "Hậu quả: mỗi lần vá phải gỡ app rồi cài lại — mà gỡ app là"
            echo "**xoá sạch dữ liệu học** trong máy."
            echo
            echo "Cách sửa một lần cho xong: \`npm run android:khoa-ky\`,"
            echo "rồi làm theo \`docs/KHOA-KY-ANDROID.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Đính APK vào bản phát hành. Hai lối vào:
      #
      #   - Đẩy tag `v*` — cách chính thức, đi cùng file .exe của Windows.
      #   - Bấm Run workflow — tạo/cập nhật bản phát hành `v<phiên bản>` ngay.
      #
      # Có lối thứ hai vì Releases nằm ở kho RIÊNG, không tính vào hạn mức 0,5 GB
      # của kho bản build. Nên lúc kho bản build đầy — và nó tính lại chậm 6–12
      # tiếng sau khi dọn — đây là đường duy nhất còn lấy được file về máy.
      - name: Đính vào bản phát hành
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ten.outputs.version }}
          name: Denken 3-shuu v${{ steps.ten.outputs.version }}
          files: out/*.apk

      # Bản build của từng commit trên main cũng phải có chỗ tải.
      #
      # Trước đây chỉ tag `v*` mới vào Releases, còn commit thường thì trông cả
      # vào kho bản build. Kho đầy thì bước tải lên bỏ qua (cố ý), luồng vẫn
      # xanh — nhưng mở lần chạy ra thì KHÔNG CÓ GÌ ĐỂ TẢI. Xanh mà tay trắng
      # là kiểu hỏng khó chịu nhất: nhìn vào tưởng xong rồi.
      #
      # Nên đẩy thêm vào một bản phát hành thử lăn theo main. Ghi đè lên chính
      # nó mỗi lần, nên không phình; và Releases nằm ở kho riêng, không tính vào
      # hạn mức 0,5 GB.
      - name: Đính vào bản thử mới nhất
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ban-thu-moi-nhat
          name: Denken 3-shuu — bản thử mới nhất
          body: |
            APK tự build từ commit mới nhất trên `main`
            (phiên bản ${{ steps.ten.outputs.version }}).

            Đây là bản THỬ, ghi đè mỗi lần build. Bản chính thức nằm ở các
            phát hành `v*` bên dưới.
          prerelease: true
          files: out/*.apk
